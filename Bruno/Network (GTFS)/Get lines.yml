info:
  name: "Get lines"
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/lines"
  auth: inherit

docs:
  content: |-
    Toutes les lignes du GTFS, groupées par mode (BUS, NOCTILIEN, METRO, TRAM, RER, TRANSILIEN, TER).
  type: text/markdown

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
