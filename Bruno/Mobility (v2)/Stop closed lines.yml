info:
  name: "Stop closed lines"
  type: http
  seq: 27

http:
  method: GET
  url: "{{baseUrl}}/api/v2/stops/{{stopAreaId}}/closed-lines"

  auth: inherit

docs:
  content: |-
    Lignes qui ne s'arrêtent pas à la zone d'arrêt en ce moment (perturbations bloquantes sur ses arrêts), triées. Vide sans info trafic. 404 si la zone d'arrêt est inconnue.
  type: text/markdown

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
