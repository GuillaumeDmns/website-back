info:
  name: "Search"
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/api/v2/search?q=chatelet&limit=10"
  params:
    - name: "q"
      value: "chatelet"
      type: query
      description: "Texte libre : nom d'arrêt, adresse, lieu, ou ligne (13, rer b, m13, bus 38, T3a)"
    - name: "limit"
      value: "10"
      type: query
      description: "Lieux, 20 max"
  auth: inherit

docs:
  content: |-
    Recherche unifiée. `lines` : lignes du GTFS dont le nom correspond (mot de mode optionnel). `places` : zones d'arrêt (avec leurs lignes, id `IDFM:…`), adresses et lieux via Navitia `places`, avec la commune dans le nom. Résultats Navitia mis en cache 10 min.
  type: text/markdown

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
