info:
  name: "Stop area"
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v2/stops/{{stopAreaId}}"

  auth: inherit

docs:
  content: |-
    Zone d'arrêt : lignes, quais (accessibilité, lignes par quai), correspondances à pied (`gtfs.transfers`) et accès (`entrances` : entrées / sorties du GTFS, `location_type` 2, numéro `code` quand il existe, nom de la rue, position ; vide hors des gares). 404 si inconnue.
  type: text/markdown

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
