info:
  name: "Stop area"
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v2/stops/{{stopAreaId}}"

  auth: inherit

docs:
  content: |-
    Zone d'arrêt : lignes, quais (accessibilité, lignes par quai) et correspondances à pied (`gtfs.transfers`). 404 si inconnue.
  type: text/markdown

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
