info:
  name: "Line closed stops"
  type: http
  seq: 26

http:
  method: GET
  url: "{{baseUrl}}/api/v2/lines/{{lineId}}/closed-stops"

  auth: inherit

docs:
  content: |-
    Zones d'arrêt que la ligne ne dessert pas en ce moment (station fermée, arrêts non desservis : perturbations bloquantes sur ses arrêts), triées. Vide sans info trafic. 404 si la ligne est inconnue.
  type: text/markdown

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
