info:
  name: "Line disruptions"
  type: http
  seq: 12

http:
  method: GET
  url: "{{baseUrl}}/api/v2/lines/{{lineId}}/disruptions"

  auth: inherit

docs:
  content: |-
    Perturbations en cours et à venir (sous 7 jours, `active: false`) d'une ligne, en cours et plus graves d'abord. 404 si la ligne est inconnue.
  type: text/markdown

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
