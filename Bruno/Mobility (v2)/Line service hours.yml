info:
  name: "Line service hours"
  type: http
  seq: 24

http:
  method: GET
  url: "{{baseUrl}}/api/v2/lines/C01742/service-hours"
  params:
    - name: "date"
      value: "2026-10-14"
      type: query
      description: "Jour de service (AAAA-MM-JJ), celui en cours par défaut (jusqu'à 3 h, la veille)"
      disabled: true

  auth: inherit

docs:
  content: |-
    Premier et dernier départs théoriques (GTFS) de chaque direction de la ligne (celles de `GET /lines/{id}`) sur une journée de service, (`direction` : indice de la direction dans `GET /lines/{id}`), comptés à l'arrêt `at` desservi par le plus de trains de la direction (le premier de la direction à égalité, souvent le terminus), avec la fréquence par période de la journée (voir « Stop service hours »). Aucun appel PRIM. Mis en cache 6 h. 404 si la ligne est inconnue.
  type: text/markdown

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
