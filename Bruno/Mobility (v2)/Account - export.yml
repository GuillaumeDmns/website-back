info:
  name: "Account - export"
  type: http
  seq: 21

http:
  method: GET
  url: "{{baseUrl}}/api/v2/me/export"

  auth: inherit

docs:
  content: |-
    Compte (`ROLE_USER` ou `ROLE_ADMIN`). Tout ce que le serveur garde sur le compte (RGPD) : le compte et ses favoris, en fichier JSON.
  type: text/markdown

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
