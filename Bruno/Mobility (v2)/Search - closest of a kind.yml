info:
  name: "Search - closest of a kind"
  type: http
  seq: 28

http:
  method: GET
  url: "{{baseUrl}}/api/v2/search?q=pharmacie&limit=10&lat=48.8566&lon=2.3522"
  params:
    - name: "q"
      value: "pharmacie"
      type: query
      description: "Un type de lieu, au singulier ou au pluriel : pharmacie, boulangerie, supermarché, café, restaurant, cinéma, musée, distributeur, toilettes…"
    - name: "limit"
      value: "10"
      type: query
      description: "Lieux, 20 max"
    - name: "lat"
      value: "48.8566"
      type: query
      description: "Position de l'appelant (obligatoire pour les plus proches, sinon recherche par nom)"
    - name: "lon"
      value: "2.3522"
      type: query
  auth: inherit

docs:
  content: |-
    Les lieux de ce type les plus proches (Photon `/reverse` sur les tags OpenStreetMap, 2 km au plus, cache 10 min par zone d'environ 200 m), puis les zones d'arrêt. Sans résultat ou si Photon échoue : la recherche habituelle.
  type: text/markdown

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
