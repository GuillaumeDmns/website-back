info:
  name: "Account"
  type: http
  seq: 20

http:
  method: GET
  url: "{{baseUrl}}/api/v2/me"

  auth: inherit

docs:
  content: |-
    Compte (`ROLE_USER` ou `ROLE_ADMIN`). Compte connecté : email, prénom (Google), rôle, connexion Google ou non.
  type: text/markdown

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
