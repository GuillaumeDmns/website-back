info:
  name: "App config"
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v2/app-config"

docs:
  content: |-
    Ce que les apps demandent au démarrage, sans authentification : version minimale par plateforme (`minVersions`), fonctions coupées (`disabledFeatures`, par exemple `vehicles`), message pour l'accueil par langue (`notice`). Vient de `application.apps` dans la configuration ; en production, modifier `application-prod.yml` puis redémarrer le service.
  type: text/markdown

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
