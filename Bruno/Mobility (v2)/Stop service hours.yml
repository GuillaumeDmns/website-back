info:
  name: "Stop service hours"
  type: http
  seq: 23

http:
  method: GET
  url: "{{baseUrl}}/api/v2/stops/IDFM:71264/service-hours"
  params:
    - name: "date"
      value: "2026-10-14"
      type: query
      description: "Jour de service (AAAA-MM-JJ), celui en cours par défaut (jusqu'à 3 h, la veille)"
      disabled: true

  auth: inherit

docs:
  content: |-
    Premier et dernier départs théoriques (GTFS) de chaque ligne de l'arrêt sur une journée de service, par direction (celles des horaires de l'arrêt), avec la fréquence par période de la journée (`EARLY_MORNING` avant 7 h, `MORNING_PEAK` 7 h–10 h, `DAYTIME` 10 h–16 h, `EVENING_PEAK` 16 h–20 h, `EVENING` 20 h–minuit, `NIGHT` après minuit) : nombre de départs et intervalle habituel `minMinutes`–`maxMinutes` (l'écart isolé plus long ou plus court mis à part). Aucun appel PRIM. Mis en cache 6 h. 404 si l'arrêt est inconnu.
  type: text/markdown

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
