info:
  name: "Line"
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/v2/lines/{{lineId}}"

  auth: inherit

docs:
  content: |-
    Ligne avec, par sens, ses branches : arrêts ordonnés et tracé `[lon, lat]`. Les missions courtes et les directs sont fusionnés dans leur branche. Mis en cache 6 h. 404 si inconnue.
  type: text/markdown

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
