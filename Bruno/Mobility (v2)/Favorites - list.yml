info:
  name: "Favorites - list"
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/api/v2/me/favorites"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const favorites = res.getBody();
        if (Array.isArray(favorites) && favorites.length > 0) {
          bru.setVar("favoriteId", favorites[favorites.length - 1].id);
        }

docs:
  content: |-
    Favoris de l'utilisateur connecté (plus anciens d'abord) : `HOME`, `WORK`, `PLACE` (label, lat, lon, stopAreaId optionnel), `STOP` (avec `stop` : zone d'arrêt et ses lignes), `LINE` (avec `line`). Stocke l'id du dernier dans `favoriteId`.
  type: text/markdown

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
