info:
  name: Get vehicle journeys from a stop point
  type: http
  seq: 1
  tags:
    - Journeys

http:
  method: GET
  url: "{{baseUrl}}/api/navitia/stop_points/{{stopPointId}}/vehicle_journeys"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
