  url: "{{baseUrl}}/api/navitia/stop_points/{{stopPointId}}/arrivals"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
