info:
  name: "Get route schedules"
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/navitia/routes/{{navitiaRouteId}}/route_schedules"
  params:
    - name: "depth"
      value: "1"
      type: query
      description: "0 à 3"
      disabled: true
    - name: "fromDatetime"
      value: "20261002T080000"
      type: query
      description: "Format YYYYMMDDThhmmss"
      disabled: true
    - name: "untilDatetime"
      value: "20261002T100000"
      type: query
      description: "Format YYYYMMDDThhmmss"
      disabled: true
    - name: "dataFreshness"
      value: "realtime"
      type: query
      description: "realtime ou base_schedule"
      disabled: true
  auth: inherit

docs:
  content: |-
    Utilise `navitiaRouteId`, renseigné par « Referential / Get routes ».
  type: text/markdown

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
