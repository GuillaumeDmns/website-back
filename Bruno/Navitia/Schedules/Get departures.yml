info:
  name: "Get departures"
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/navitia/stop_points/{{navitiaStopPointId}}/departures?count=10"
  params:
    - name: "count"
      value: "10"
      type: query
    - name: "fromDatetime"
      value: "20261002T080000"
      type: query
      description: "Format YYYYMMDDThhmmss"
      disabled: true
    - name: "untilDatetime"
      value: "20261002T100000"
      type: query
      description: "Format YYYYMMDDThhmmss"
      disabled: true
    - name: "dataFreshness"
      value: "realtime"
      type: query
      description: "realtime ou base_schedule"
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
