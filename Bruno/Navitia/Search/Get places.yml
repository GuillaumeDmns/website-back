info:
  name: "Get places"
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/navitia/places?query=Châtelet"
  params:
    - name: "query"
      value: "Châtelet"
      type: query
      description: "Texte recherché (obligatoire)"
    - name: "type"
      value: "stop_area"
      type: query
      description: "Répétable : stop_area, stop_point, address, poi, administrative_region"
      disabled: true
    - name: "count"
      value: "10"
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
