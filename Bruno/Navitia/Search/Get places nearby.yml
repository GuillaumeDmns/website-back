info:
  name: "Get places nearby"
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/navitia/places_nearby?lon={{lon}}&lat={{lat}}&distance=300&type=stop_area"
  params:
    - name: "lon"
      value: "{{lon}}"
      type: query
      description: "Longitude (obligatoire)"
    - name: "lat"
      value: "{{lat}}"
      type: query
      description: "Latitude (obligatoire)"
    - name: "distance"
      value: "300"
      type: query
      description: "Rayon en mètres"
    - name: "type"
      value: "stop_area"
      type: query
      description: "Répétable"
    - name: "count"
      value: "10"
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
