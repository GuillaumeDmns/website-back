info:
  name: "Get companies"
  type: http
  seq: 15

http:
  method: GET
  url: "{{baseUrl}}/api/navitia/companies?count=10"
  params:
    - name: "startPage"
      value: "0"
      type: query
      disabled: true
    - name: "count"
      value: "10"
      type: query
    - name: "depth"
      value: "1"
      type: query
      description: "0 à 3"
      disabled: true
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // Réutilisé par les requêtes « by ID » de la collection
        const first = (res.getBody()?.companies || [])[0];
        if (first?.id) {
          bru.setVar("navitiaCompanyId", first.id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
