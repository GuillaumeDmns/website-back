info:
  name: Get stop area by ID
  type: http
  seq: 1
  tags:
    - Stop Areas

http:
  method: GET
  url: "{{baseUrl}}/stop_areas/{{id}}"
  headers:
    Authorization: "Bearer {{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
