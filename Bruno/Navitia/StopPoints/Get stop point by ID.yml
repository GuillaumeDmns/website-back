info:
  name: Get stop point by ID
  type: http
  seq: 1
  tags:
    - Stop Points

http:
  method: GET
  url: "{{baseUrl}}/stop_points/{{id}}"
  headers:
    Authorization: "Bearer {{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
