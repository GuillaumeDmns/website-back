info:
  name: "Logout"
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/logout"
  body:
    type: json
    data: |-
      {
        "refreshToken": "{{refreshToken}}"
      }

docs:
  content: |-
    Public. Révoque le refresh token. 204 même s'il était déjà invalide.
  type: text/markdown

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
