info:
  name: "Login"
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/signin"
  body:
    type: json
    data: |-
      {
        "username": "{{username}}",
        "password": "{{password}}"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        const jwt = res.getBody()?.jwt;
        if (jwt) {
          bru.setEnvVar("jwt", jwt);
        }

docs:
  content: |-
    Public. Stocke le JWT renvoyé dans la variable d'environnement `jwt`.
  type: text/markdown

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
