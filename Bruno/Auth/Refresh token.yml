info:
  name: "Refresh token"
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/token/refresh"
  body:
    type: json
    data: |-
      {
        "refreshToken": "{{refreshToken}}"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        if (body?.jwt) {
          bru.setEnvVar("jwt", body.jwt);
        }
        if (body?.refreshToken) {
          bru.setEnvVar("refreshToken", body.refreshToken);
        }

docs:
  content: |-
    Public. Échange le refresh token contre un nouveau `jwt` et un nouveau `refreshToken` (l'ancien devient invalide).
    Réutiliser un refresh token déjà échangé révoque tous ceux de l'utilisateur. 401 si invalide, expiré ou révoqué.
  type: text/markdown

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
