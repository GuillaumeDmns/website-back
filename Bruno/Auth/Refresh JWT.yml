info:
  name: "Refresh JWT"
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/refresh"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const jwt = res.getBody()?.jwt;
        if (jwt) {
          bru.setEnvVar("jwt", jwt);
        }

docs:
  content: |-
    Ancienne méthode (site React) : renvoie un nouveau JWT à partir d'un JWT encore valide et le stocke dans `jwt`.
    Les apps utilisent plutôt « Refresh token ».
  type: text/markdown

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
