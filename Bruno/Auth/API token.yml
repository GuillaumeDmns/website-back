info:
  name: "API token"
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/auth/api-token"
  body:
    type: json
    data: |-
      {
        "token": "{{apiToken}}"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        if (body?.jwt) {
          bru.setEnvVar("jwt", body.jwt);
        }

docs:
  content: |-
    Public. Échange le jeton d'API personnel `apiToken` (`gdpat_…`, créé par un admin dans « Mon compte » de l'app ou par `Admin / API tokens - create`) contre un JWT d'une heure, sans refresh token. Le script de la collection le fait tout seul quand `jwt` manque ou expire. 401 si le jeton est inconnu, révoqué ou expiré.
  type: text/markdown

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
