info:
  name: "Sign up"
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/signup"
  body:
    type: json
    data: |-
      {
        "username": "new_user",
        "email": "new_user@example.com",
        "password": "new_user_password"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        if (body?.jwt) {
          bru.setEnvVar("jwt", body.jwt);
        }
        if (body?.refreshToken) {
          bru.setEnvVar("refreshToken", body.refreshToken);
        }

docs:
  content: |-
    Public. Crée un compte `ROLE_USER` et renvoie directement `jwt` + `refreshToken` (stockés dans l'environnement).
    201 si créé, 400 si un champ est invalide (username 3-50 caractères `[A-Za-z0-9._-]`, email, mot de passe 8 caractères minimum), 409 si le username ou l'email est déjà utilisé.
  type: text/markdown

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
