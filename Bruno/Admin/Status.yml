info:
  name: "Status"
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/admin/status"

  auth: inherit

docs:
  content: |-
    Admin. État du service, pour la supervision : quotas PRIM du jour (`used` / `limit`, part des invités, et le décompte de PRIM à sa dernière réponse : `primUsed` / `primLimit` à `primObservedAt`, qui inclut les autres utilisateurs de la clé), appels du jour par fonction (`features` : `DEPARTURES`, `VEHICLES`, `JOURNEYS`, `WALKING_PATHS`, `PLACES`, `TRAFFIC`, avec la part des invités), coupe-circuits PRIM (`CLOSED`, `OPEN` jusqu'à `openUntil`, `TRIAL`), dernier import GTFS réussi et dernier import (`gtfsStale` : aucun succès depuis 26 h), heures des derniers chargements du trafic (`trafficSnapshotAt`, toutes les 3 min au plus) et des ascenseurs (`elevatorsSnapshotAt`, toutes les heures).
  type: text/markdown

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
