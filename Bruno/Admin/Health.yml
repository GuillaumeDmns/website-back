info:
  name: "Health"
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/health"

docs:
  content: |-
    Santé de l'application, sans authentification : 200 `{"status":"UP"}` quand elle répond et que sa base aussi, 503 sinon. Utilisé par le déploiement (`deploy/activate-release.sh`) et la supervision.
  type: text/markdown

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
