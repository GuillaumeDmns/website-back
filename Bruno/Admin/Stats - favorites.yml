info:
  name: "Stats - favorites"
  type: http
  seq: 9

http:
  method: GET
  url: "{{baseUrl}}/api/admin/stats/favorites?days=90"
  params:
    - name: days
      value: "90"
      type: query

  auth: inherit

docs:
  content: |-
    Admin. Favoris : par type, arrêts et lignes les plus enregistrés, ajouts par jour sur `days` (positions jamais données).
  type: text/markdown

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
