info:
  name: "Stats - accounts"
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/api/admin/stats/accounts?days=90"
  params:
    - name: days
      value: "90"
      type: query

  auth: inherit

docs:
  content: |-
    Admin. Comptes (anonyme) : totaux, actifs et nouveaux, inscriptions par jour sur `days`, comptes actifs par jour (7 derniers jours), ancienneté de la dernière connexion, favoris par compte.
  type: text/markdown

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
