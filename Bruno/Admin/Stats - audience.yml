info:
  name: "Stats - audience"
  type: http
  seq: 20

http:
  method: GET
  url: "{{baseUrl}}/api/admin/stats/audience?days=30"
  params:
    - name: days
      value: "30"
      type: query

  auth: inherit

docs:
  content: |-
    Admin. Par jour : comptes et appareils invités actifs, appareils par plateforme et par version de l'app, visiteurs des sites ; pages vues, pages les plus vues et sites référents, sur `days`. Comptages anonymes seulement.
  type: text/markdown

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
