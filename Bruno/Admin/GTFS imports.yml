info:
  name: "GTFS imports"
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/gtfs/imports?limit=20"
  params:
    - name: limit
      value: "20"
      type: query

  auth: inherit

docs:
  content: |-
    Admin. Derniers imports GTFS, du plus récent au plus ancien : `source` (`WATCH` = nouvelle version détectée, `MANUAL` = `POST /api/gtfs`), `feedDate` (date de la version sur Opendatasoft), `status` (`RUNNING`, `SUCCESS`, `FAILED`), lignes par table ou erreur.
  type: text/markdown

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
