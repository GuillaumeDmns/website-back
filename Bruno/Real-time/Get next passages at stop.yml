info:
  name: "Get next passages at stop"
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/get-stop-next-passages?stopId={{gtfsStopId}}&lineId={{lineId}}"
  params:
    - name: "stopId"
      value: "{{gtfsStopId}}"
      type: query
      description: "Id GTFS de l'arrêt (IDFM:monomodalStopPlace:45102 = Châtelet - Les Halles RER)"
    - name: "lineId"
      value: "{{lineId}}"
      type: query
      description: "Filtre facultatif sur une ligne"
  auth: inherit

docs:
  content: |-
    Prochains passages à un arrêt (PRIM stop-monitoring).
  type: text/markdown

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
