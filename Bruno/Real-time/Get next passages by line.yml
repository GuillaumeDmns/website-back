info:
  name: "Get next passages by line"
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/full-idfm?lineId={{lineId}}"
  params:
    - name: "lineId"
      value: "{{lineId}}"
      type: query
      description: "Id IDFM de la ligne"
  auth: inherit

docs:
  content: |-
    Prochains passages à tous les arrêts de la ligne (PRIM estimated-timetable).
  type: text/markdown

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
