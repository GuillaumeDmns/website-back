info:
  name: "Get general messages"
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/general-message?lineId={{lineId}}"
  params:
    - name: "lineId"
      value: "{{lineId}}"
      type: query
      description: "Id IDFM de la ligne"
    - name: "stopId"
      value: "{{zdeId}}"
      type: query
      description: "Id numérique de la zone d'embarquement (22087 = Châtelet métro 1)"
      disabled: true
  auth: inherit

docs:
  content: |-
    Messages affichés sur les écrans (PRIM general-message). `lineId` ou `stopId` obligatoire.
  type: text/markdown

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
