opencollection: 1.0.0

info:
  name: Website backend
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  auth:
    type: bearer
    token: "{{jwt}}"
  variables:
    - name: lineId
      value: C01742
      description: Id IDFM de ligne (C01742 = RER A, C01371 = métro 1)
    - name: stopAreaId
      value: IDFM:71264
      description: Id de zone d'arrêt (station parente GTFS) pour les endpoints v2 (Châtelet)
    - name: lon
      value: "2.3470"
    - name: lat
      value: "48.8584"
  scripts:
    - type: before-request
      code: |-
        // Connexion automatique : obtient un JWT quand il manque ou expire dans moins d'une minute
        const expiresAt = (token) => {
          try {
            const payload = token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
            const json = typeof Buffer !== "undefined" ? Buffer.from(payload, "base64").toString("utf8") : atob(payload);
            return JSON.parse(json).exp * 1000;
          } catch (e) {
            return 0;
          }
        };

        const isSignin = req.getUrl().includes("/api/signin");
        const currentJwt = bru.getEnvVar("jwt");

        if (!isSignin && (!currentJwt || expiresAt(currentJwt) - 60000 < Date.now())) {
          try {
            const response = await bru.sendRequest({
              method: "POST",
              url: bru.getEnvVar("baseUrl") + "/api/signin",
              headers: { "Content-Type": "application/json" },
              data: { username: bru.getEnvVar("username"), password: bru.getEnvVar("password") }
            });
            const jwt = response.data && response.data.jwt;
            if (jwt) {
              bru.setEnvVar("jwt", jwt);
              req.setHeader("Authorization", "Bearer " + jwt);
            }
          } catch (e) {
            console.warn("Connexion automatique impossible, vérifier username et password de l'environnement :", e.message);
          }
        }
    - type: after-response
      code: |-
        // JWT refusé (expiré, secret changé...) : on l'oublie pour que la prochaine requête se reconnecte
        if (res.getStatus() === 401 && !req.getUrl().includes("/api/signin")) {
          bru.setEnvVar("jwt", "");
        }

docs:
  content: |-
    Collection du backend (API `/api`). Choisir un environnement (Local ou Production) qui définit `baseUrl`, `username` et `password`.

    L'authentification est automatique : le script de la collection se connecte via `/api/signin` quand le JWT manque ou va expirer, et le stocke dans `jwt`. Toutes les requêtes héritent du bearer `{{jwt}}` (sauf Login).

    - **Auth** : login, inscription, refresh token, logout
    - **Admin** : import GTFS
    - **Mobility (v2)** : API des applis (arrêts, lignes, départs, itinéraires, trafic, Vélib, favoris)

    Les variables de collection donnent des exemples réels (Châtelet, RER A).
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
