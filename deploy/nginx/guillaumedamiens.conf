# http-level settings, installed in /etc/nginx/conf.d by deploy/nginx/apply.sh

# Compression of the static sites (React, Flutter web); the API compresses its own JSON responses
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css text/javascript application/javascript application/json application/wasm image/svg+xml;

# API access log without the query string: positions (nearby, journeys) stay out of the logs
log_format guillaumedamiens_api '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time';

# Per IP, in front of the backend's own rate limiting
limit_req_zone $binary_remote_addr zone=guillaumedamiens_api:10m rate=10r/s;
