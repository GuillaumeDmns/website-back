# Security headers, included at server level (installed in /etc/nginx/snippets). A location with its own add_header
# drops these: include the file there too.
# Every name under guillaumedamiens.com is served over HTTPS: a browser that came once never tries HTTP on any
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
# None of the sites is meant to be shown inside another page (clickjacking)
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
