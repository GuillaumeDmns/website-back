# Backend API, included in the guillaumedamiens.com server block (installed in /etc/nginx/snippets)
location /api/ {
    limit_req zone=guillaumedamiens_api burst=30 nodelay;
    limit_req_status 429;

    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 90s;

    access_log /var/log/nginx/access.log guillaumedamiens_api;

    # Backend restarting (deployment): a JSON answer the apps understand instead of nginx's HTML page
    error_page 502 504 = @api_unavailable;
}

location @api_unavailable {
    default_type application/problem+json;
    add_header Retry-After 15 always;
    return 503 '{"title":"Service Unavailable","status":503,"detail":"The server is restarting, retry in a few seconds"}';
}
