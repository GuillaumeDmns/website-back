name: Deploy
# Tag a commit of master (git tag v1.2.3 && git push origin v1.2.3), or run it by hand on a branch
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
concurrency: deploy
jobs:
  deploy:
    name: Deploy to the VPS
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
      - name: 🛠 Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Build
        run: ./mvnw -B clean package -DskipTests
      # Secrets: DEPLOY_HOST, DEPLOY_SSH_KEY (private key of the deploy user), DEPLOY_KNOWN_HOSTS (ssh-keyscan of the host)
      - name: Upload and activate
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          jar="website-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}.jar"
          scp -i ~/.ssh/deploy_key target/website-0.0.1-SNAPSHOT.jar "deploy@$DEPLOY_HOST:/opt/guillaumedamiens/releases/$jar"
          ssh -i ~/.ssh/deploy_key "deploy@$DEPLOY_HOST" bash -s -- "$jar" < deploy/activate-release.sh
