name: Deploy
# Tag a commit of master (git tag v1.2.3 && git push origin v1.2.3), or run it by hand on a tag. The jar becomes an
# asset of the tag's GitHub release and the VPS downloads it: uploads from GitHub's runners to the VPS crawl (about
# 20 KB/s), downloads from GitHub to the VPS are fast.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
concurrency: deploy
permissions:
  contents: write
jobs:
  deploy:
    name: Deploy to the VPS
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Tags only
        if: github.ref_type != 'tag'
        run: |
          echo "Run this workflow on a tag (v1.2.3): the jar is published in the tag's release" >&2
          exit 1
      - uses: actions/checkout@v6
      - name: 🛠 Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Build
        run: ./mvnw -B clean package -DskipTests
      - name: Publish the jar in the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jar="website-${GITHUB_REF_NAME}-${GITHUB_SHA::7}.jar"
          cp target/website-0.0.1-SNAPSHOT.jar "$jar"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$jar" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$jar" --title "$GITHUB_REF_NAME" --generate-notes
          fi
          echo "jar=$jar" >> "$GITHUB_OUTPUT"
          echo "url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$jar" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$jar" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      # Secrets: DEPLOY_HOST, DEPLOY_SSH_KEY (private key of the deploy user), DEPLOY_KNOWN_HOSTS (ssh-keyscan of the host)
      - name: Download on the VPS and activate
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          JAR: ${{ steps.release.outputs.jar }}
          URL: ${{ steps.release.outputs.url }}
          SHA256: ${{ steps.release.outputs.sha256 }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -o ConnectTimeout=20 -i ~/.ssh/deploy_key "deploy@$DEPLOY_HOST" bash -s -- "$JAR" "$URL" "$SHA256" < deploy/activate-release.sh
