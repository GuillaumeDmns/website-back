name: Build
# Every pull request and every push to master: unit tests, integration tests (Testcontainers: PostGIS in Docker,
# available on GitHub's runners), then the production jar started against an empty database. The "Build and test"
# check is required to merge into master (branch protection).
on:
  pull_request:
  push:
    branches: [master]
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: website
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - name: 🛠 Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Unit and integration tests, jar
        run: ./mvnw -B verify
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports
          retention-days: 7
      # Liquibase migrations on an empty database and Hibernate validation of the entities, production profile
      - name: Start against an empty database
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/website
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          SECURITY_JWT_TOKEN_SECRETKEY: ci-only-secret-0123456789abcdef0123456789abcdef
          APPLICATION_IDFMKEY: none
          APPLICATION_IDFMSTATICKEY: none
        run: |
          java -jar target/website-0.0.1-SNAPSHOT.jar --spring.profiles.active=prod > app.log 2>&1 &
          for _ in $(seq 1 60); do
            sleep 3
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/health)" = 200 ]; then
              echo "Started"
              exit 0
            fi
          done
          cat app.log
          exit 1
