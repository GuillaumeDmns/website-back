name: Build
on: ["push"]
jobs:
  build:
    name: Build and start
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: website
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - name: 🛠 Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Build
        run: ./mvnw -B clean package -DskipTests
      # Liquibase migrations on an empty database and Hibernate validation of the entities
      - name: Start against an empty database
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/website
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          SECURITY_JWT_TOKEN_SECRETKEY: ci-only-secret-0123456789abcdef0123456789abcdef
          APPLICATION_IDFMKEY: none
          APPLICATION_IDFMSTATICKEY: none
        run: |
          java -jar target/website-0.0.1-SNAPSHOT.jar --spring.profiles.active=prod > app.log 2>&1 &
          for _ in $(seq 1 60); do
            sleep 3
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/health)" = 200 ]; then
              echo "Started"
              exit 0
            fi
          done
          cat app.log
          exit 1
