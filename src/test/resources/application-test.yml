# Integration tests (IntegrationTest): database from Testcontainers, external APIs on a local FakeServer
security:
  jwt:
    token:
      secret-key: integration-tests-only-0123456789abcdef0123456789abcdef

application:
  idfm-key: test-prim-key
  idfm-static-key: test-opendatasoft-key
  cors-allowed-origins:
    - https://app.example.com
  google:
    client-ids:
      - test-client.apps.googleusercontent.com
    desktop:
      client-id: test-client.apps.googleusercontent.com
      client-secret: test-google-secret
      redirect-uri: https://api.example.com/api/auth/google/desktop/callback
  admin-emails:
    - admin@example.com
  gtfs:
    min-free-disk-gb: 0
  # The tests trigger the GTFS import themselves
  scheduling:
    enabled: false

logging:
  level:
    root: WARN
    com.gdamiens.website: WARN
