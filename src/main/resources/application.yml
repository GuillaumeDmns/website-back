spring:
  profiles:
    # For local runs. The production service passes --spring.profiles.active=prod (deploy/guillaumedamiens.service);
    # application-dev.yml is left out of the jar, so a run without profile fails instead of using the dev secrets
    active: dev
  threads:
    virtual:
      enabled: true
  datasource:
    username: root
    password: root
    url: jdbc:postgresql://localhost:5432/guillaumedamiens
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
    open-in-view: false

logging:
  level:
    org.hibernate.persister.entity: ERROR

springdoc:
  packages-to-scan: com.gdamiens.website.controller
  paths-to-match: /api/**
  swagger-ui:
    disable-swagger-default-url: true

security:
  jwt:
    token:
      expire-length: 3600000 # 1 hour
      # secret-key is defined in application-dev.yml
    refresh-token:
      expire-days: 60

server:
  # Behind the reverse proxy: take the client IP from X-Forwarded-For (only trusted from internal proxy addresses)
  forward-headers-strategy: native
  # JSON responses (line paths, timetables, traffic) are large
  compression:
    enabled: true

application:
  cors-allowed-origins:
    - https://guillaumedamiens.com
    - https://app.guillaumedamiens.com
    - http://localhost:3000
  rate-limit:
    auth-per-minute: 10
    user-per-minute: 120
    anonymous-per-minute: 60
  # Guest devices: 15 % of each PRIM quota (accounts keep the rest), capped journey searches
  quota:
    guest-share: 0.15
  budget:
    guest-journeys-per-day: 10
    user-journeys-per-day: 150
    user-journeys-per-hour: 60
    guest-tokens-per-ip-per-hour: 30

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true

logging:
  file:
    path: ./

# Flutter web dev server runs on a random localhost port
application:
  cors-allowed-origins:
    - https://guillaumedamiens.com
    - https://app.guillaumedamiens.com
    - http://localhost:[*]
    - http://127.0.0.1:[*]

---
spring:
  config:
    activate:
      on-profile: prod

# Secrets (datasource, security.jwt.token.secret-key, application.idfm-key, application.idfm-static-key) come from
# environment variables. Logs go to the standard output (journald). No API docs in production.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
