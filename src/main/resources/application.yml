spring:
  profiles:
    active: dev
  datasource:
    username: root
    password: root
    url: jdbc:postgresql://localhost:5432/guillaumedamiens
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
    open-in-view: false

logging:
  file:
    path: ./
  level:
    org.hibernate.persister.entity: ERROR

springdoc:
  packages-to-scan: com.gdamiens.website.controller
  paths-to-match: /api/**
  swagger-ui:
    disable-swagger-default-url: true

security:
  jwt:
    token:
      expire-length: 3600000 # 1 hour
      # secret-key is defined in application-dev.yml
    refresh-token:
      expire-days: 60

server:
  # Behind the reverse proxy: take the client IP from X-Forwarded-For (only trusted from internal proxy addresses)
  forward-headers-strategy: native

application:
  cors-allowed-origins:
    - https://guillaumedamiens.com
    - https://app.guillaumedamiens.com
    - http://localhost:3000
  rate-limit:
    auth-per-minute: 10
    user-per-minute: 120
    anonymous-per-minute: 60

---
spring:
  config:
    activate:
      on-profile: dev

# Flutter web dev server runs on a random localhost port
application:
  cors-allowed-origins:
    - https://guillaumedamiens.com
    - https://app.guillaumedamiens.com
    - http://localhost:[*]
    - http://127.0.0.1:[*]
